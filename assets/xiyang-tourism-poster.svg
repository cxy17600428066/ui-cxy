<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">山西昔阳文旅宣传海报</title>
  <desc id="desc">以太行山意象和暖色晨光为主视觉，展示昔阳山水风光、红色文化与城市烟火。</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8dcc0"/>
      <stop offset="35%" stop-color="#f3bf7f"/>
      <stop offset="70%" stop-color="#db7a48"/>
      <stop offset="100%" stop-color="#a5372e"/>
    </linearGradient>
    <linearGradient id="sunGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9d6"/>
      <stop offset="100%" stop-color="#ffd075"/>
    </linearGradient>
    <linearGradient id="mountainBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6f3a2d"/>
      <stop offset="100%" stop-color="#402322"/>
    </linearGradient>
    <linearGradient id="mountainMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8d4e2f"/>
      <stop offset="100%" stop-color="#4d2d23"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b85e35"/>
      <stop offset="100%" stop-color="#5e3527"/>
    </linearGradient>
    <linearGradient id="riverGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7d8a1"/>
      <stop offset="40%" stop-color="#ffe8bf"/>
      <stop offset="100%" stop-color="#f5b56b"/>
    </linearGradient>
    <linearGradient id="panelGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,241,220,0.92)"/>
      <stop offset="100%" stop-color="rgba(255,226,188,0.84)"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#481f17" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bgGradient)"/>

  <circle cx="820" cy="360" r="170" fill="url(#sunGradient)" opacity="0.9"/>
  <circle cx="820" cy="360" r="230" fill="#ffe0a2" opacity="0.28"/>
  <circle cx="820" cy="360" r="300" fill="#ffcf87" opacity="0.16"/>

  <path d="M0,860 C170,730 280,690 410,760 C560,840 660,720 820,690 C920,670 1010,700 1080,760 L1080,1120 L0,1120 Z" fill="url(#mountainBack)" opacity="0.9"/>
  <path d="M0,980 C120,900 210,840 360,890 C490,935 600,860 720,820 C860,775 980,830 1080,900 L1080,1260 L0,1260 Z" fill="url(#mountainMid)" opacity="0.93"/>
  <path d="M0,1160 C130,1020 250,1010 380,1050 C530,1098 640,1020 760,980 C900,930 1000,980 1080,1030 L1080,1510 L0,1510 Z" fill="url(#mountainFront)" opacity="0.97"/>

  <path d="M70,1440 C240,1380 390,1360 550,1390 C720,1420 860,1490 1010,1650 L1010,1760 C850,1620 710,1540 550,1510 C380,1480 220,1500 70,1580 Z" fill="url(#riverGradient)" opacity="0.85"/>

  <g opacity="0.35" fill="#fff5dc">
    <ellipse cx="180" cy="410" rx="110" ry="38"/>
    <ellipse cx="278" cy="402" rx="88" ry="32"/>
    <ellipse cx="390" cy="446" rx="98" ry="34"/>
    <ellipse cx="920" cy="520" rx="120" ry="38"/>
    <ellipse cx="760" cy="560" rx="85" ry="30"/>
  </g>

  <rect x="72" y="120" width="936" height="640" rx="42" fill="url(#panelGradient)" filter="url(#softShadow)"/>

  <text x="130" y="220" fill="#8b2c1f" font-size="46" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" letter-spacing="8">山西晋中</text>
  <text x="130" y="328" fill="#5f2218" font-size="130" font-weight="700" font-family="'STKaiti', 'KaiTi', 'FangSong', serif">昔阳</text>
  <text x="130" y="410" fill="#8b2c1f" font-size="50" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" letter-spacing="6">XIYANG</text>
  <text x="130" y="498" fill="#6f2b1d" font-size="54" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">太行风骨  红色热土</text>
  <text x="130" y="570" fill="#7a3824" font-size="36" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">来昔阳，赴一场山水与人文之约</text>
  <text x="130" y="630" fill="#7a3824" font-size="36" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">看太行层峦，访红色旧址，品山城烟火</text>

  <g transform="translate(120,820)">
    <rect x="0" y="0" width="840" height="610" rx="36" fill="rgba(66,25,20,0.22)" stroke="rgba(255,228,197,0.45)" stroke-width="2"/>
    <text x="46" y="92" fill="#ffe8c9" font-size="56" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">昔阳值得你慢慢走</text>
    <text x="52" y="178" fill="#ffe6c2" font-size="38" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">01  太行山城</text>
    <text x="52" y="228" fill="#ffe6c2" font-size="32" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">峡谷、古村、田园交织出北方山水气韵</text>
    <text x="52" y="304" fill="#ffe6c2" font-size="38" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">02  红色记忆</text>
    <text x="52" y="354" fill="#ffe6c2" font-size="32" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">在革命旧址与展馆中触摸历史温度</text>
    <text x="52" y="430" fill="#ffe6c2" font-size="38" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">03  晋东烟火</text>
    <text x="52" y="480" fill="#ffe6c2" font-size="32" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">尝地道风味，感受热情朴实的人情味</text>
    <text x="52" y="560" fill="#fff4df" font-size="34" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">昔阳欢迎您</text>
  </g>

  <g transform="translate(790,1600)">
    <rect x="0" y="0" width="190" height="190" rx="18" fill="#fff6ea" opacity="0.95"/>
    <path d="M20,60 h150 M20,96 h150 M20,132 h150 M60,20 v150 M96,20 v150 M132,20 v150" stroke="#d07d4a" stroke-width="6" opacity="0.38"/>
    <text x="95" y="230" text-anchor="middle" fill="#ffebd2" font-size="28" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">扫码了解更多</text>
  </g>

  <text x="84" y="1810" fill="#ffe6bf" font-size="28" letter-spacing="2" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">山西省晋中市昔阳县文化和旅游宣传</text>
</svg>
